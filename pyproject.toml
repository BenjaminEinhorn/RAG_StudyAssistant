[project]
name = "mbax6418-course-assistant"
version = "0.1.0"
description = "MBAX 6418 Course Assistant — hybrid RAG over course slides with visual evidence and quizzes."
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0,<7",
    "openai>=1.40",
    "chromadb>=0.5",
    "bm25s",
    "langchain-text-splitters>=0.3",
    "python-pptx>=0.6.23",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
course-assistant = "course_assistant.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
