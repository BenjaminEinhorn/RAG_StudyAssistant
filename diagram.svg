<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c2d12"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274b6d"/><stop offset="1" stop-color="#1b3145"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0a24b"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#0d1117"/>
  <rect width="1280" height="56" fill="url(#hdr)"/>
  <text x="24" y="37" fill="#fff" font-size="22" font-weight="700">MBAX 6418 Course Assistant — Architecture</text>
  <text x="1180" y="37" fill="#ffe7c4" font-size="12" text-anchor="end">Gradio app runs locally · class services remote (dobolyi.com:9001+)</text>

  <!-- Column headers -->
  <text x="24" y="92" fill="#f0a94e" font-size="13" font-weight="700" letter-spacing="1">DOCUMENT PREPARATION</text>
  <text x="388" y="92" fill="#f0a94e" font-size="13" font-weight="700" letter-spacing="1">INDEXING (TEXT + VISUAL, SEPARATE)</text>
  <text x="856" y="92" fill="#f0a94e" font-size="13" font-weight="700" letter-spacing="1">RETRIEVAL · RERANK · ANSWER</text>

  <!-- ============ Column 1: Preparation ============ -->
  <rect x="24" y="108" width="340" height="52" rx="10" fill="#151a21" stroke="#2a2f38"/>
  <text x="38" y="129" fill="#e6e6e6" font-size="13" font-weight="600">User uploads</text>
  <text x="38" y="147" fill="#9aa4b1" font-size="12">PPTX · PDF · DOCX · TXT (add / remove in-app)</text>

  <line x1="194" y1="160" x2="194" y2="180" stroke="#e0a24b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="24" y="182" width="340" height="56" rx="10" fill="#151a21" stroke="#2a2f38"/>
  <text x="38" y="203" fill="#e6e6e6" font-size="13" font-weight="600">LibreOffice (soffice, local)</text>
  <text x="38" y="221" fill="#9aa4b1" font-size="12">PPTX → PDF (headless convert)</text>
  <text x="38" y="233" fill="#9aa4b1" font-size="11">skipped on plain PDFs</text>

  <line x1="194" y1="238" x2="194" y2="258" stroke="#e0a24b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="24" y="260" width="340" height="58" rx="10" fill="#151a21" stroke="#2a2f38"/>
  <text x="38" y="281" fill="#e6e6e6" font-size="13" font-weight="600">PyMuPDF (local)</text>
  <text x="38" y="299" fill="#9aa4b1" font-size="12">per page/slide: extract text + render image</text>

  <line x1="194" y1="318" x2="194" y2="338" stroke="#e0a24b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="24" y="340" width="340" height="50" rx="10" fill="#151a21" stroke="#2a2f38"/>
  <text x="38" y="362" fill="#e6e6e6" font-size="13" font-weight="600">Chunking (langchain splits)</text>
  <text x="38" y="380" fill="#9aa4b1" font-size="12">recursive vs fixed; chunk keeps slide/page ref</text>

  <!-- ============ Column 2: Indexes ============ -->
  <rect x="388" y="118" width="440" height="116" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="402" y="140" fill="#f0a94e" font-size="13" font-weight="700">TEXT INDEX (separate)</text>
  <text x="402" y="162" fill="#e6e6e6" font-size="12">- bm25s keyword index (tokenized chunks)</text>
  <text x="402" y="181" fill="#e6e6e6" font-size="12">- Chroma vector store · text embeddings</text>
  <text x="402" y="200" fill="#9aa4b1" font-size="11">  ← :9002 Nemotron /v2/embed (query|document)</text>
  <text x="402" y="218" fill="#9aa4b1" font-size="11">  metadata: doc_id · doc_name · slide · image_path</text>

  <rect x="388" y="250" width="440" height="100" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="402" y="272" fill="#f0a94e" font-size="13" font-weight="700">VISUAL INDEX (separate)</text>
  <text x="402" y="294" fill="#e6e6e6" font-size="12">- Chroma collection of slide-image embeddings</text>
  <text x="402" y="313" fill="#9aa4b1" font-size="11">  ← :9003 Qwen3-VL-Embedding (images + text queries)</text>
  <text x="402" y="331" fill="#9aa4b1" font-size="11">  enables image/slide retrieval for diagram questions</text>

  <text x="388" y="378" fill="#9aa4b1" font-size="12">JSONL chunk registry + PNG renders persist in ./data (gitignored)</text>

  <!-- ============ Column 3: Retrieve / Rerank / Answer ============ -->
  <rect x="856" y="118" width="400" height="76" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="870" y="140" fill="#f0a94e" font-size="12" font-weight="700">HYBRID RETRIEVE</text>
  <text x="870" y="161" fill="#e6e6e6" font-size="12">keyword (bm25) ∪ text-vector ∪ visual-image</text>
  <text x="870" y="180" fill="#9aa4b1" font-size="11">reciprocal-rank fusion of keyword + text-vector</text>

  <line x1="1056" y1="194" x2="1056" y2="214" stroke="#e0a24b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="856" y="216" width="400" height="62" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="870" y="238" fill="#e6e6e6" font-size="12" font-weight="600">RERANK candidates</text>
  <text x="870" y="256" fill="#9aa4b1" font-size="11">class reranker :9004 (text + slide images) · no silent fallback</text>

  <line x1="1056" y1="278" x2="1056" y2="298" stroke="#e0a24b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="856" y="300" width="400" height="92" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="870" y="322" fill="#e6e6e6" font-size="12" font-weight="600">ANSWER GENERATION (vision LLM, remote)</text>
  <text x="870" y="342" fill="#9aa4b1" font-size="11">prompt = top evidence + source refs; slide images</text>
  <text x="870" y="360" fill="#9aa4b1" font-size="11">sent as vision input when relevant</text>
  <text x="870" y="378" fill="#9aa4b1" font-size="11">→ JSON {found, answer, citations} · citations verified in code</text>

  <line x1="1056" y1="392" x2="1056" y2="412" stroke="#e0a24b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="856" y="414" width="400" height="58" rx="12" fill="#1b3145"/>
  <text x="870" y="436" fill="#cfe3ff" font-size="13" font-weight="700">Gradio UI → {answer, sources, slide images}</text>
  <text x="870" y="456" fill="#8fb3dd" font-size="11">answer + cited slide/page + original image; quiz with hidden key</text>

  <!-- Flow arrows text -> index -->
  <line x1="364" y1="365" x2="388" y2="150" stroke="#e0a24b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="364" y1="365" x2="388" y2="292" stroke="#e0a24b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Config note -->
  <rect x="24" y="560" width="1232" height="92" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="40" y="584" fill="#f0a94e" font-size="13" font-weight="700">Configuration (.env — secrets never committed)</text>
  <text x="40" y="606" fill="#e6e6e6" font-size="12">COURSE_LLM_BASE_URL (vision LLM, :9001) · COURSE_TEXT_EMBED_BASE_URL (:9002) · COURSE_VISUAL_EMBED_BASE_URL (:9003) ·</text>
  <text x="40" y="626" fill="#e6e6e6" font-size="12">COURSE_RERANK_BASE_URL (:9004) · COURSE_PARSE_BASE_URL (:9005) · COURSE_API_KEY · CHUNK_SIZE / CHUNK_OVERLAP · COURSE_BUILD_MODE (local|full)</text>
  <text x="40" y="644" fill="#9aa4b1" font-size="11">Contract verified live by probe_endpoints.py (vLLM 0.29.0); key placeholder only in .env.example.</text>

  <rect x="24" y="470" width="804" height="60" rx="12" fill="#151a21" stroke="#2a2f38"/>
  <text x="40" y="492" fill="#e6e6e6" font-size="13" font-weight="600">Quiz generation (same retrieval)</text>
  <text x="40" y="511" fill="#9aa4b1" font-size="12">MCQs grounded in retrieved slides · hidden answer key · score + explanations with sources</text>
</svg>
